[project]
name = "nekomind-backend"
version = "0.1.0"
description = "Backend do NekoMind: ingestao de audio, ASR, topicos e metricas heuristicas (tecnica Feynman)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
asr = ["faster-whisper>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
serial = ["pyserial>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
